<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>For the Team</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;1,9..144,500&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #1B1533;
    --bg-2: #241C42;
    --card: #2A2151;
    --ink: #F3EFE8;
    --ink-dim: #B9AFD6;
    --gold: #D4A73A;
  }

  *{ box-sizing: border-box; }

  html, body{
    margin: 0;
    padding: 0;
    background: radial-gradient(circle at 20% 0%, var(--bg-2), var(--bg) 60%);
    color: var(--ink);
    font-family: 'Work Sans', sans-serif;
    min-height: 100vh;
    overflow-x: hidden;
  }

  body::before,
  body::after {
    content: "";
    position: fixed;
    width: 480px;
    height: 480px;
    border-radius: 50%;
    filter: blur(90px);
    opacity: 0.32;
    pointer-events: none;
    z-index: 0;
    animation: floatGlow 12s ease-in-out infinite alternate;
  }

  body::before {
    background: rgba(122, 96, 255, 0.4);
    top: -120px;
    left: -100px;
  }

  body::after {
    background: rgba(255, 124, 171, 0.26);
    right: -90px;
    bottom: -120px;
    animation-delay: 2s;
  }

  @keyframes floatGlow {
    0% { transform: translate3d(0, 0, 0) scale(1); }
    100% { transform: translate3d(18px, -18px, 0) scale(1.08); }
  }

  .wrap{
    max-width: 1100px;
    margin: 0 auto;
    padding: 72px 24px 100px;
  }

  header{
    text-align: center;
    margin-bottom: 64px;
  }

  header .eyebrow{
    color: var(--gold);
    font-size: 15px;
    letter-spacing: 0.02em;
    margin-bottom: 14px;
  }

  header h1{
    font-family: 'Fraunces', serif;
    font-weight: 600;
    font-size: clamp(34px, 5vw, 56px);
    line-height: 1.1;
    margin: 0 0 18px;
  }

  header p{
    color: var(--ink-dim);
    font-size: 17px;
    max-width: 480px;
    margin: 0 auto;
    line-height: 1.6;
  }

  .grid{
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(230px, 1fr));
    gap: 22px;
  }

  .card{
    position: relative;
    background: var(--card);
    border-radius: 18px;
    padding: 28px 24px;
    cursor: pointer;
    border: 1px solid rgba(255,255,255,0.06);
    transition: transform 0.25s ease, border-color 0.25s ease, box-shadow 0.25s ease;
    overflow: hidden;
    min-height: 190px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    box-shadow: 0 12px 24px rgba(16, 12, 33, 0.16);
  }

  .card::before{
    content: "";
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 5px;
    background: var(--accent, var(--gold));
  }

  .card::after{
    content: "";
    position: absolute;
    inset: -40% auto auto -20%;
    width: 130%;
    height: 90%;
    background: linear-gradient(120deg, transparent 20%, rgba(255,255,255,0.18), transparent 80%);
    transform: translateX(-120%) rotate(8deg);
    transition: transform 0.8s ease;
    pointer-events: none;
  }

  .card:hover{
    transform: translateY(-4px);
    border-color: var(--accent, var(--gold));
    box-shadow: 0 20px 36px rgba(12, 10, 24, 0.28), 0 0 18px rgba(255, 255, 255, 0.06);
  }

  .card:hover::after {
    transform: translateX(120%) rotate(8deg);
  }

  .card.unlocked {
    box-shadow: 0 0 0 1px rgba(255,255,255,0.18), 0 18px 34px rgba(255,255,255,0.08), 0 0 22px rgba(255,255,255,0.12);
    border-color: rgba(255,255,255,0.2);
  }

  .card .avatar{
    width: 52px;
    height: 52px;
    border-radius: 50%;
    background: var(--accent, var(--gold));
    color: #1B1533;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Fraunces', serif;
    font-weight: 600;
    font-size: 19px;
    margin-bottom: 20px;
  }

  .card .name{
    font-family: 'Fraunces', serif;
    font-size: 21px;
    font-weight: 600;
    margin-bottom: 6px;
  }

  .card .hint{
    color: var(--ink-dim);
    font-size: 13.5px;
  }

  /* overlay */
  .overlay{
    position: fixed;
    inset: 0;
    background: rgba(12, 8, 28, 0.82);
    backdrop-filter: blur(6px);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    z-index: 50;
    opacity: 0;
    visibility: hidden;
    transition: opacity 0.28s ease, visibility 0.28s ease;
  }
  .overlay.active{
    opacity: 1;
    visibility: visible;
  }

  .panel{
    background: var(--bg-2);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 20px;
    max-width: 460px;
    width: 100%;
    padding: 40px 36px;
    text-align: center;
    position: relative;
    opacity: 0;
    transform: translateY(18px) scale(0.96);
    transition: transform 0.32s ease, opacity 0.32s ease;
  }

  .overlay.active .panel{
    opacity: 1;
    transform: translateY(0) scale(1);
  }

  .panel .avatar-lg{
    width: 68px;
    height: 68px;
    border-radius: 50%;
    background: var(--accent, var(--gold));
    color: #1B1533;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Fraunces', serif;
    font-weight: 600;
    font-size: 24px;
    margin: 0 auto 18px;
  }

  .panel h2{
    font-family: 'Fraunces', serif;
    font-weight: 600;
    font-size: 24px;
    margin: 0 0 6px;
  }

  .panel .sub{
    color: var(--ink-dim);
    font-size: 14px;
    margin-bottom: 26px;
  }

  .panel input[type="password"]{
    width: 100%;
    padding: 13px 16px;
    border-radius: 10px;
    border: 1px solid rgba(255,255,255,0.14);
    background: rgba(255,255,255,0.04);
    color: var(--ink);
    font-size: 15px;
    font-family: 'Work Sans', sans-serif;
    outline: none;
  }

  .panel input[type="password"]:focus{
    border-color: var(--accent, var(--gold));
  }

  .panel .error{
    color: #E8735C;
    font-size: 13px;
    margin-top: 10px;
    min-height: 18px;
  }

  .panel .actions{
    margin-top: 22px;
    display: flex;
    gap: 12px;
    justify-content: center;
  }

  .btn{
    border: none;
    border-radius: 999px;
    padding: 12px 26px;
    font-size: 14.5px;
    font-weight: 500;
    cursor: pointer;
    font-family: 'Work Sans', sans-serif;
  }

  .btn-primary{
    background: var(--accent, var(--gold));
    color: #1B1533;
  }

  .btn-ghost{
    background: transparent;
    color: var(--ink-dim);
    border: 1px solid rgba(255,255,255,0.14);
  }

  .quote-view{ display: none; }
  .quote-view.active{ display: block; }
  .pass-view.hidden{ display: none; }

  .final-popup {
    position: fixed;
    inset: 0;
    background: rgba(15, 11, 29, 0.84);
    backdrop-filter: blur(6px);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    opacity: 0;
    visibility: hidden;
    pointer-events: none;
    transition: opacity 0.26s ease, visibility 0.26s ease;
    z-index: 80;
  }

  .final-popup.active {
    opacity: 1;
    visibility: visible;
    pointer-events: auto;
  }

  .final-popup-card {
    width: min(520px, 100%);
    background: linear-gradient(180deg, rgba(42,33,81,0.98), rgba(27,21,51,0.98));
    border: 1px solid rgba(255,255,255,0.12);
    border-radius: 22px;
    padding: 28px 26px 24px;
    text-align: center;
    box-shadow: 0 24px 50px rgba(6, 5, 17, 0.42);
    transform: translateY(16px) scale(0.96);
    opacity: 0;
    transition: transform 0.28s ease, opacity 0.28s ease;
  }

  .final-popup.active .final-popup-card {
    transform: translateY(0) scale(1);
    opacity: 1;
  }

  .final-popup-card .label {
    color: var(--gold);
    font-size: 12px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    margin-bottom: 16px;
  }

  .final-popup-card blockquote {
    margin: 0;
    font-family: 'Fraunces', serif;
    font-style: italic;
    font-size: clamp(22px, 3vw, 32px);
    line-height: 1.45;
    color: var(--ink);
  }

  .final-popup-card .heart {
    color: #F16D7F;
    display: inline-block;
    margin-left: 8px;
  }

  .final-popup-card .actions {
    margin-top: 24px;
  }

  .quote-view blockquote{
    font-family: 'Fraunces', serif;
    font-style: italic;
    font-size: 22px;
    line-height: 1.5;
    margin: 6px 0 0;
    color: var(--ink);
  }

  .quote-view .heart{
    display: inline-block;
    color: #E8735C;
    margin-left: 6px;
  }

  .sparkle-layer{
    position: absolute;
    inset: 0;
    pointer-events: none;
    overflow: hidden;
    border-radius: 20px;
  }

  .sparkle{
    position: absolute;
    top: var(--sy);
    left: var(--sx);
    width: var(--ssize);
    height: var(--ssize);
    color: var(--accent, var(--gold));
    opacity: 0;
    transform: translate(-50%, -50%) scale(0) rotate(0deg);
    animation: sparkle-pop var(--sdur) ease-out var(--sdelay) forwards;
  }

  .sparkle svg{ width: 100%; height: 100%; display: block; }

  @keyframes sparkle-pop{
    0%{ opacity: 0; transform: translate(-50%, -50%) scale(0) rotate(0deg); }
    35%{ opacity: 1; transform: translate(-50%, -50%) scale(1) rotate(90deg); }
    100%{ opacity: 0; transform: translate(-50%, calc(-50% - 26px)) scale(0.3) rotate(160deg); }
  }

  .close-x{
    position: absolute;
    top: 16px;
    right: 18px;
    background: none;
    border: none;
    color: var(--ink-dim);
    font-size: 20px;
    cursor: pointer;
    line-height: 1;
  }

  footer{
    text-align: center;
    color: var(--ink-dim);
    font-size: 13px;
    margin-top: 80px;
  }

  @media (prefers-reduced-motion: reduce){
    .card, .panel{ transition: none; animation: none; }
  }
</style>
</head>
<body>

<div class="wrap">
  <header>
    <div class="eyebrow">A little something for each of you</div>
    <h1>Open your card</h1>
    <p>One box, one password, one thing I wanted you to hear. Find your name below.</p>
  </header>

  <div class="grid" id="grid"></div>

  <footer>Made with care, for the team by hemanth :)</footer>
</div>

<div class="final-popup" id="finalPopup" aria-live="polite">
  <div class="final-popup-card">
    <div class="label">A final note</div>
    <blockquote id="finalPopupText">You are the reason this team feels like family. <span class="heart">❤</span></blockquote>
    <div class="actions">
      <button class="btn btn-primary" id="finalPopupClose">Keep going</button>
    </div>
  </div>
</div>

<div class="overlay" id="overlay">
  <div class="panel" id="panel">
    <button class="close-x" id="closeBtn" aria-label="Close">&times;</button>
    <div class="sparkle-layer" id="sparkleLayer"></div>

    <div class="pass-view" id="passView">
      <div class="avatar-lg" id="avatarLg"></div>
      <h2 id="nameLabel"></h2>
      <div class="sub">This one's just for you. Enter your password.</div>
      <input type="password" id="passInput" placeholder="Password" autocomplete="off" />
      <div class="error" id="errorMsg"></div>
      <div class="actions">
        <button class="btn btn-ghost" id="cancelBtn">Cancel</button>
        <button class="btn btn-primary" id="unlockBtn">Unlock</button>
      </div>
    </div>

    <div class="quote-view" id="quoteView">
      <div class="avatar-lg" id="avatarLg2"></div>
      <h2 id="nameLabel2"></h2>
      <blockquote id="quoteText"></blockquote>
      <div class="actions">
        <button class="btn btn-primary" id="doneBtn">Close</button>
      </div>
    </div>
  </div>
</div>

<audio id="celebrateAudio" src="bhagabhaga.mp3" preload="auto"></audio>

<script>
  const team = [
    { name: "Aaditya B", quote: "They say the sky is the limit but not for you, don't forget your amazing", password: "aaditya", color: "#E85D75" },
    { name: "Arunesh A", quote: "For all the battles you've won that no one knows about. Keep going", password: "arunesh", color: "#F2A65A" },
    { name: "Arvind P", quote: "Take a moment today to appreciate how much you've grown, and you're still standing.", password: "arvind", color: "#4FB0A5" },
    { name: "Gnana Swetha P", quote: "The little girl in you is proud of how far you have come. Keep going", password: "swetha", color: "#8B7FD1" },
    { name: "Harshit S", quote: "You're building the life of a future billionaire. Be proud of every step you've taken.", password: "harshit", color: "#E8735C" },
    { name: "Jyotipushpa S", quote: "You've carried pain that nobody saw, fought battles nobody knew about, and still found a way to keep moving. Be proud of yourself.", password: "jyoti", color: "#7FA77A" },
    { name: "Pratik V", quote: "Every time you feel like giving up, remember why you started", password: "pratik", color: "#5B8DBF" },
    { name: "Rasika K", quote: "I hope all the kindness you show to others finds its way back to you", password: "rasika", color: "#A75B8C" },
    { name: "Vinod C", quote: "You are capable of becoming more than you ever imagined.", password: "vinod", color: "#D4A73A" }
  ];

  const grid = document.getElementById('grid');
  const overlay = document.getElementById('overlay');
  const panel = document.getElementById('panel');
  const passView = document.getElementById('passView');
  const quoteView = document.getElementById('quoteView');
  const avatarLg = document.getElementById('avatarLg');
  const avatarLg2 = document.getElementById('avatarLg2');
  const nameLabel = document.getElementById('nameLabel');
  const nameLabel2 = document.getElementById('nameLabel2');
  const passInput = document.getElementById('passInput');
  const errorMsg = document.getElementById('errorMsg');
  const quoteText = document.getElementById('quoteText');
  const audio = document.getElementById('celebrateAudio');
  const sparkleLayer = document.getElementById('sparkleLayer');
  const finalPopup = document.getElementById('finalPopup');
  const finalPopupText = document.getElementById('finalPopupText');
  audio.loop = true;

  const endingQuotes = [
    'You are the reason this team feels like family. Thank you for showing up with heart and courage. <span class="heart">❤</span>',
    'Your effort, warmth, and presence make this team better every single day. <span class="heart">❤</span>',
    'Keep winning quietly, keep growing loudly, and keep believing in yourself. <span class="heart">❤</span>',
    'You carry more strength than you realize, and the world needs that part of you. <span class="heart">❤</span>',
    'You are not just part of the team — you are part of the energy that makes it shine. <span class="heart">❤</span>',
    'The best is still ahead of you, and this team is proud to walk beside you. <span class="heart">❤</span>',
    'Your kindness is not small. It is the reason people feel safe, seen, and supported. <span class="heart">❤</span>',
    'Keep going with the same heart. It is your superpower, and it is changing things. <span class="heart">❤</span>',
    'You are deeply valued, genuinely appreciated, and always more capable than you think. <span class="heart">❤</span>'
  ];

  let endingQuoteIndex = 0;
  let hasUnlockedCard = false;

  function initials(name){
    return name.split(' ').map(p => p[0]).slice(0,2).join('').toUpperCase();
  }

  let current = null;
  let currentCard = null;

  team.forEach(person => {
    const card = document.createElement('div');
    card.className = 'card';
    card.style.setProperty('--accent', person.color);
    card.innerHTML = `
      <div>
        <div class="avatar">${initials(person.name)}</div>
        <div class="name">${person.name}</div>
      </div>
      <div class="hint">Tap to unlock your note</div>
    `;
    card.addEventListener('click', () => openPanel(person, card));
    grid.appendChild(card);
  });

  function openPanel(person, card = null){
    current = person;
    currentCard = card;
    sparkleLayer.innerHTML = '';
    panel.style.setProperty('--accent', person.color);
    avatarLg.textContent = initials(person.name);
    avatarLg2.textContent = initials(person.name);
    nameLabel.textContent = person.name;
    nameLabel2.textContent = person.name;
    passInput.value = '';
    errorMsg.textContent = '';
    passView.classList.remove('hidden');
    quoteView.classList.remove('active');
    overlay.classList.add('active');
    setTimeout(() => passInput.focus(), 50);
  }

  function closePanel(){
    overlay.classList.remove('active');
    sparkleLayer.innerHTML = '';

    if (currentCard && currentCard.classList.contains('unlocked')) {
      const quote = endingQuotes[endingQuoteIndex % endingQuotes.length];
      endingQuoteIndex += 1;
      finalPopupText.innerHTML = quote;
      finalPopup.classList.add('active');
    }

    current = null;
    currentCard = null;
  }

  function hideFinalPopup(){
    finalPopup.classList.remove('active');
  }

  const sparkleSvg = '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 0 L14.2 9.8 L24 12 L14.2 14.2 L12 24 L9.8 14.2 L0 12 L9.8 9.8 Z"/></svg>';

  function fireSparkles(color = '#D4A73A'){
    sparkleLayer.innerHTML = '';
    sparkleLayer.style.setProperty('--accent', color);
    const count = 18;
    for (let i = 0; i < count; i++){
      const s = document.createElement('div');
      s.className = 'sparkle';
      s.style.color = color;
      s.style.setProperty('--sx', Math.random() * 100 + '%');
      s.style.setProperty('--sy', Math.random() * 100 + '%');
      s.style.setProperty('--ssize', (8 + Math.random() * 14) + 'px');
      s.style.setProperty('--sdur', (0.7 + Math.random() * 0.6) + 's');
      s.style.setProperty('--sdelay', (Math.random() * 0.35) + 's');
      s.innerHTML = sparkleSvg;
      sparkleLayer.appendChild(s);
    }
  }

  function tryUnlock(){
    if (!current) return;
    if (passInput.value === current.password){
      passView.classList.add('hidden');
      quoteView.classList.add('active');
      quoteText.innerHTML = current.quote + ' <span class="heart">&#10084;</span>';

      if (audio.paused) {
        audio.currentTime = 0;
        audio.play().catch(() => {});
      }

      if (currentCard && !currentCard.classList.contains('unlocked')) {
        currentCard.classList.add('unlocked');
      }

      hasUnlockedCard = true;

      fireSparkles(current.color);
    } else {
      errorMsg.textContent = "That's not quite it — try again.";
      passInput.value = '';
      passInput.focus();
    }
  }

  document.getElementById('unlockBtn').addEventListener('click', tryUnlock);
  passInput.addEventListener('keydown', e => { if (e.key === 'Enter') tryUnlock(); });
  document.getElementById('cancelBtn').addEventListener('click', closePanel);
  document.getElementById('closeBtn').addEventListener('click', closePanel);
  document.getElementById('doneBtn').addEventListener('click', closePanel);
  document.getElementById('finalPopupClose').addEventListener('click', hideFinalPopup);
  overlay.addEventListener('click', e => { if (e.target === overlay) closePanel(); });
  document.addEventListener('keydown', e => { if (e.key === 'Escape' && overlay.classList.contains('active')) closePanel(); });
</script>

</body>
</html>
